version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: librax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: librax
      POSTGRES_USER: librax_user
      POSTGRES_PASSWORD: librax_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librax_user -d librax"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: librax_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://librax_user:librax_secret@postgres:5432/librax"
      SECRET_KEY: "librax-super-secret-jwt-key-change-in-production-2024"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      FINE_PER_DAY: "2.0"
      MAX_BORROW_DAYS: "14"
      MAX_BOOKS_PER_STUDENT: "3"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        alembic upgrade head &&
        python seed/seed.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ─────────────────────────────────────────────
  # React Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: librax_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://localhost:8000"

volumes:
  postgres_data:
    driver: local
